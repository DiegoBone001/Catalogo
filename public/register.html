<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - FoodDelivery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-orange-50 to-red-50 min-h-screen">

    <!-- Navbar -->
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-black text-orange-600">
                🍕 <span
                    class="bg-gradient-to-r from-orange-600 to-red-600 bg-clip-text text-transparent">FoodDelivery</span>
            </a>
            <div class="flex gap-4">
                <a href="index.html" class="text-gray-700 hover:text-orange-600 font-semibold">Iniciar Sesión</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mx-auto px-4 py-16">
        <div class="max-w-md mx-auto">

            <div class="bg-white rounded-3xl shadow-2xl p-8">
                <h2 class="text-3xl font-black text-gray-800 mb-2 text-center">Crear Cuenta</h2>
                <p class="text-center text-gray-600 mb-8">Únete y disfruta de comida deliciosa</p>

                <!-- Alert Container -->
                <div id="alertContainer" class="mb-4 hidden"></div>

                <form id="registerForm" class="space-y-6">
                    <div>
                        <label for="name" class="block text-sm font-semibold text-gray-700 mb-2">Nombre Completo</label>
                        <input type="text" id="name" name="name" required minlength="3"
                            class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-orange-500 focus:ring focus:ring-orange-200 transition-all"
                            placeholder="Juan Pérez">
                    </div>

                    <div>
                        <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">Email</label>
                        <input type="email" id="email" name="email" required
                            class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-orange-500 focus:ring focus:ring-orange-200 transition-all"
                            placeholder="tu@email.com">
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">Contraseña</label>
                        <input type="password" id="password" name="password" required minlength="8"
                            class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-orange-500 focus:ring focus:ring-orange-200 transition-all"
                            placeholder="Mínimo 8 caracteres">
                        <p class="text-xs text-gray-500 mt-1">La contraseña debe tener al menos 8 caracteres</p>
                    </div>

                    <div>
                        <label for="password_confirmation"
                            class="block text-sm font-semibold text-gray-700 mb-2">Confirmar Contraseña</label>
                        <input type="password" id="password_confirmation" name="password_confirmation" required
                            minlength="8"
                            class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-orange-500 focus:ring focus:ring-orange-200 transition-all"
                            placeholder="Repetir contraseña">
                    </div>

                    <button type="submit" id="submitBtn"
                        class="w-full bg-gradient-to-r from-orange-500 to-red-600 text-white py-4 rounded-xl font-bold text-lg hover:shadow-xl transform hover:scale-105 transition-all">
                        Crear Cuenta
                    </button>
                </form>

                <p class="text-center text-gray-600 mt-6">
                    ¿Ya tienes cuenta?
                    <a href="index.html" class="text-orange-600 font-semibold hover:underline">Inicia sesión aquí</a>
                </p>
            </div new>

            <!-- Benefits -->
            <div class="mt-8 text-center">
                <p class="text-gray-600 mb-4 font-semibold">Al registrarte obtendrás:</p>
                <div class="space-y-2">
                    <div class="flex items-center justify-center gap-2 text-gray-700">
                        <span class="text-green-500">✓</span>
                        <span>Recomendaciones según el clima</span>
                    </div>
                    <div class="flex items-center justify-center gap-2 text-gray-700">
                        <span class="text-green-500">✓</span>
                        <span>Guarda tus favoritos</span>
                    </div>
                    <div class="flex items-center justify-center gap-2 text-gray-700">
                        <span class="text-green-500">✓</span>
                        <span>Comenta y califica productos</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script type="module">
        import { register } from './js/api.js';

        function showAlert(message, type = 'error') {
            const container = document.getElementById('alertContainer');
            const bgColor = type === 'error' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700';

            container.innerHTML = `
                <div class="${bgColor} px-4 py-3 rounded-xl">
                    ${message}
                </div>
            `;
            container.classList.remove('hidden');

            setTimeout(() => {
                container.classList.add('hidden');
            }, 5000);
        }

        // Handle register form
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const passwordConfirmation = document.getElementById('password_confirmation').value;
            const submitBtn = document.getElementById('submitBtn');

            // Validate passwords match
            if (password !== passwordConfirmation) {
                showAlert('Las contraseñas no coinciden', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Creando cuenta...';

            const result = await register(name, email, password, passwordConfirmation);

            if (result.success) {
                showAlert('Cuenta creada exitosamente', 'success');
                setTimeout(() => {
                    window.location.href = 'catalog.html';
                }, 1500);
            } else {
                showAlert(result.message, 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Crear Cuenta';
            }
        });
    </script>

</body>

</html>
